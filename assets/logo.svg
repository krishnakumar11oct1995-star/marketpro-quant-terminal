<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="500" height="500" rx="100" fill="url(#bg)"/>
  <rect x="25" y="25" width="450" height="450" rx="85" fill="none" stroke="#1e293b" stroke-width="3"/>
  <!-- Candlesticks Matrix -->
  <line x1="140" y1="170" x2="140" y2="350" stroke="#06B6D4" stroke-width="4" opacity="0.6"/>
  <rect x="125" y="210" width="30" height="90" rx="6" fill="url(#cyan)"/>
  
  <line x1="210" y1="130" x2="210" y2="380" stroke="#F59E0B" stroke-width="4" opacity="0.8"/>
  <rect x="195" y="160" width="30" height="150" rx="6" fill="url(#gold)" filter="url(#glow)"/>
  
  <line x1="280" y1="190" x2="280" y2="330" stroke="#06B6D4" stroke-width="4" opacity="0.6"/>
  <rect x="265" y="220" width="30" height="70" rx="6" fill="url(#cyan)"/>
  
  <line x1="350" y1="110" x2="350" y2="370" stroke="#F59E0B" stroke-width="4" opacity="0.8"/>
  <rect x="335" y="140" width="30" height="160" rx="6" fill="url(#gold)" filter="url(#glow)"/>
  <!-- Quant Trend Polyline -->
  <polyline points="100,320 140,250 210,180 280,240 350,150 400,120" fill="none" stroke="#10B981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="400" cy="120" r="10" fill="#10B981" filter="url(#glow)"/>
</svg>
